name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  check-skills:
    name: Check Skills Sync
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check skill symlinks
        run: |
          for skill in yoetz; do
            test -L .claude/skills/$skill || (echo "❌ .claude/skills/$skill is not a symlink" && exit 1)
            test -L .agents/skills/$skill || (echo "❌ .agents/skills/$skill is not a symlink" && exit 1)
            test "$(readlink .claude/skills/$skill)" = "../../skills/$skill" || (echo "❌ .claude/skills/$skill target wrong" && exit 1)
            test "$(readlink .agents/skills/$skill)" = "../../skills/$skill" || (echo "❌ .agents/skills/$skill target wrong" && exit 1)
          done
          diff -rq skills/yoetz .claude/skills/yoetz || (echo "❌ content mismatch" && exit 1)
          echo "✓ Skill symlinks valid"

  changes:
    name: Detect Light-Only Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      light_only: ${{ steps.detect.outputs.light_only }}
      browser_changed: ${{ steps.detect.outputs.browser_changed }}
      build_os_matrix: ${{ steps.detect.outputs.build_os_matrix }}
      release_push: ${{ steps.detect.outputs.release_push }}
      dependency_changed: ${{ steps.detect.outputs.dependency_changed }}
      workflow_changed: ${{ steps.detect.outputs.workflow_changed }}
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
      PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test change classifier
        run: ./scripts/test-ci-classify-changes.sh
      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              head_ref="$PR_HEAD_REF"
              subject="$PR_TITLE"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              head_ref=""
              subject="${PUSH_COMMIT_MESSAGE%%$'\n'*}"
              ;;
            *)
              ./scripts/ci-classify-changes.sh \
                "$GITHUB_EVENT_NAME" "" "" | tee -a "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ -z "${base:-}" || -z "${head:-}" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            ./scripts/ci-classify-changes.sh \
              "$GITHUB_EVENT_NAME" "$head_ref" "$subject" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "$base" "$head")
          ./scripts/ci-classify-changes.sh \
            "$GITHUB_EVENT_NAME" "$head_ref" "$subject" "${files[@]}" | tee -a "$GITHUB_OUTPUT"

  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check immutable action pins
        run: ./scripts/check-workflow-action-pins.sh
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # actionlint 1.7.12
        with:
          args: -color

  release-commit-fast-path:
    name: Release Commit Fast Path
    needs: changes
    if: needs.changes.outputs.release_push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Release commit detected on main."
          echo "The Release workflow owns release verification, artifact builds, and package publication for this commit."

  browser-scripts:
    name: Browser Scripts
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Verify live-CDP daemon bundle
        run: ./scripts/build-live-cdp-daemon.sh --check
      - name: Verify ChatGPT native extension package
        run: ./scripts/build-chatgpt-native-extension.sh --check
      - name: Test ChatGPT native extension
        run: node --test extensions/chatgpt-native/tests/*.test.js
      - run: npm ci --prefix scripts --omit=dev --ignore-scripts
      - name: Verify sweet-cookie exports
        working-directory: scripts
        run: |
          node --input-type=module -e "
            import { getCookies, toCookieHeader } from '@steipete/sweet-cookie';
            if (typeof getCookies !== 'function') throw new Error('getCookies is not a function');
            if (typeof toCookieHeader !== 'function') throw new Error('toCookieHeader is not a function');
            console.log('sweet-cookie exports verified');
          "
      - name: Smoke-test cookie extractor imports
        working-directory: scripts
        run: node ./extract-cookies.mjs --smoke-test

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.release_push != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.release_push != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Light-only short-circuit
        if: needs.changes.outputs.light_only == 'true'
        run: |
          echo "Skipping Clippy because this PR only touches docs / changelog / release metadata."
          echo "See the 'Detect Light-Only Changes' job for the file set that triggered the fast path."
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.changes.outputs.light_only != 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        if: needs.changes.outputs.light_only != 'true'
        with:
          shared-key: rust-stable-${{ runner.os }}
          cache-bin: false
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.light_only != 'true'

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.release_push != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Light-only short-circuit
        if: needs.changes.outputs.light_only == 'true'
        run: |
          echo "Skipping Test because this PR only touches docs / changelog / release metadata."
          echo "See the 'Detect Light-Only Changes' job for the file set that triggered the fast path."
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.changes.outputs.light_only != 'true'
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        if: needs.changes.outputs.light_only != 'true'
        with:
          shared-key: rust-stable-${{ runner.os }}
          cache-bin: false
      - run: cargo test --workspace
        if: needs.changes.outputs.light_only != 'true'

  msrv:
    name: MSRV (1.88)
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust-msrv-1.88-${{ runner.os }}
          cache-bin: false
      # --all-targets compiles dev-dependencies too; without it a dev-dep with
      # rust-version above the MSRV passes this job while `cargo test` breaks.
      - run: cargo check --workspace --all-targets

  doc:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust-stable-${{ runner.os }}
          cache-bin: false
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  gitleaks:
    name: Gitleaks
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.build_os_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust-stable-${{ runner.os }}
          cache-bin: false
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os != 'windows-latest'
        with:
          name: yoetz-${{ matrix.os }}
          path: target/release/yoetz
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'windows-latest'
        with:
          name: yoetz-${{ matrix.os }}
          path: target/release/yoetz.exe
          retention-days: 3
          compression-level: 0

  browser-integration:
    name: Real-Browser Smoke (Chrome for Testing)
    needs: changes
    if: needs.changes.outputs.release_push != 'true' && needs.changes.outputs.light_only != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.browser_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust-stable-${{ runner.os }}
          cache-bin: false
      - name: Install Chrome for Testing
        id: install-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          chrome-version: stable
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libasound2t64 \
            fonts-liberation \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libu2f-udev \
            libvulkan1 \
            xdg-utils
      - name: Fake-ChatGPT fixture tests
        env:
          YOETZ_CHROME_BIN: ${{ steps.install-chrome.outputs.chrome-path }}
        run: cargo test -p yoetz fake_chatgpt_fixture_ -- --ignored
      - name: Build yoetz smoke binary
        run: cargo build --bin yoetz
      - name: Real-browser smoke
        env:
          YOETZ_CHROME_BIN: ${{ steps.install-chrome.outputs.chrome-path }}
          YOETZ_BIN: target/debug/yoetz
        run: ./scripts/ci-real-browser-smoke.sh
