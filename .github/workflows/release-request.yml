name: Release Request

run-name: Release request ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string

# Writes go through the release GitHub App token. GITHUB_TOKEN stays read-only
# so a compromised workflow job cannot push or open PRs as github-actions[bot].
permissions:
  contents: read

concurrency:
  group: release-request
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  GIT_TERMINAL_PROMPT: "0"
  GH_PROMPT_DISABLED: "1"

jobs:
  request:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Release requests must be dispatched from main (got ${REF})."
            exit 1
          fi

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be X.Y.Z (e.g. 0.5.97), got: ${VERSION}"
            exit 1
          fi

      - name: Require release GitHub App
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" ]]; then
            echo "::error::vars.RELEASE_APP_CLIENT_ID is not set; the release GitHub App is required so merge can trigger release.yml."
            exit 1
          fi

      - name: Mint release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: rust-test-${{ runner.os }}
          save-if: false
          cache-bin: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/chatgpt-native/package-lock.json

      - name: Prepare release branch and open PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          ./scripts/release.sh --ci "$VERSION"
